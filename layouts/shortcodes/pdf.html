{{ $pdf := .Page.Resources.GetMatch (.Get "src") }}
{{ if $pdf }}
  <div style="margin: 1.5rem 0;">
    <iframe
      src="{{ $pdf.RelPermalink }}"
      width="100%"
      height="900"
      style="border: 1px solid #e5e7eb; border-radius: 12px; background: #fff;">
    </iframe>
    <p style="margin-top: 0.75rem;">
      <a href="{{ $pdf.RelPermalink }}" target="_blank" rel="noopener noreferrer">在新标签页打开 PDF</a>
      &nbsp;|&nbsp;
      <a href="{{ $pdf.RelPermalink }}" download>下载 PDF</a>
    </p>
  </div>
{{ else }}
  <p>未找到 PDF 文件：{{ .Get "src" }}</p>
{{ end }}
