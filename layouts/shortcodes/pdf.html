{{ $pdf := .Page.Resources.GetMatch (.Get "src") }}
{{ $height := .Get "height" | default "1100" }}

{{ if $pdf }}
  <div class="not-prose pdf-embed-outer">
    <div class="pdf-embed-box">
      <iframe
        src="{{ $pdf.RelPermalink }}#toolbar=1&navpanes=0&zoom=page-width"
        width="100%"
        height="{{ $height }}"
        loading="lazy">
      </iframe>
    </div>

    <p class="pdf-actions">
      <a href="{{ $pdf.RelPermalink }}" target="_blank" rel="noopener noreferrer">在新标签页打开 PDF</a>
      &nbsp;|&nbsp;
      <a href="{{ $pdf.RelPermalink }}" download>下载 PDF</a>
    </p>
  </div>
{{ else }}
  <p>未找到 PDF 文件：{{ .Get "src" }}</p>
{{ end }}
